<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="几猫3A大作">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="离线可玩的国产第一人称射击游戏移动版。">
  <title>几猫3A大作</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/game.css">
  <link rel="stylesheet" href="./src/mobile-shell.css">
</head>
<body>
  <div id="app">
    <canvas id="view" tabindex="0" aria-label="几猫3A大作游戏画面"></canvas>
    <div id="ui"></div>
    <div id="boot">
      <div class="boot-mark">几猫</div>
      <div class="boot-sub" id="boot-msg">正在载入几猫港区</div>
      <div class="boot-bar"><i id="boot-fill"></i></div>
    </div>
  </div>
  <div id="rotate-hint" role="status" aria-live="polite">
    <span class="rotate-phone" aria-hidden="true"></span>
    <strong>请将手机横过来</strong>
  </div>
  <script src="./src/mobile-shell.js"></script>
  <script src="./src/game.js"></script>
</body>
</html>
